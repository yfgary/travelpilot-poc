<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #eef2f6;
    color: #222;

    font-family:
        Arial,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

header {
    background:
        linear-gradient(
            135deg,
            #163a5c,
            #28689d
        );

    color: white;
    text-align: center;

    padding:
        20px 12px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    opacity: .9;
}


/* =========================================================
   PAGE SWITCH
========================================================= */

.page-switch {
    background: white;

    padding: 8px;

    text-align: center;

    box-shadow:
        0 2px 6px
        rgba(0,0,0,.08);
}

.page-switch a {
    display: inline-block;

    margin: 3px;

    padding:
        8px 14px;

    border-radius: 18px;

    text-decoration: none;

    background: #eaf2f8;
    color: #1f4e79;

    font-weight: 600;
    font-size: 14px;
}

.page-switch a.active {
    background: #1f4e79;
    color: white;
}


/* =========================================================
   NAV
========================================================= */

.quick-nav {
    position: sticky;
    top: 0;

    z-index: 1000;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #d6dee5;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.06);
}

.quick-nav-inner {
    max-width: 1250px;

    margin: auto;

    padding:
        8px 10px;

    display: flex;

    gap: 7px;

    overflow-x: auto;

    white-space: nowrap;
}

.nav-btn {
    border: 0;

    background: #eaf2f8;
    color: #1f4e79;

    text-decoration: none;

    border-radius: 18px;

    padding:

    font-weight: 600;
    font-size: 13px;

    cursor: pointer;

    flex: 0 0 auto;
}

.nav-btn:hover {
    background: #d5e7f3;
}

.nav-btn.dark {
    background: #1f4e79;
    color: white;
}

.nav-btn.today {
    background: #dff1e3;
    color: #28633b;

    box-shadow:
        inset 0 0 0 1px #a8d1b3;
}


/* =========================================================
   MAIN
========================================================= */

.container {
    max-width: 1250px;

    margin: auto;

    padding: 16px;
}


/* =========================================================
   TODAY STATUS
========================================================= */

.today-panel {
    background: white;

    border-radius: 12px;

    padding:

.today-main {

}

.today-title {
    font-size: 17px;

    font-weight: 700;

    color: #1f4e79;
}

.today-text {
    margin-top: 4px;

    color: #65727c;

    font-size: 13px;

    line-height: 1.5;
}

.time-info {
    margin-top: 8px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}

.time-pill {
    background: #f0f4f7;

    color: #53626d;

    border-radius: 14px;

    padding:
        5px 9px;

    font-size: 11px;
}


/* =========================================================
   NOTICE
========================================================= */

.notice {
    background: #fff8df;

    border:
        1px solid #f0dda1;

    border-radius: 10px;

    padding:
        12px 14px;

    margin-bottom: 15px;

    font-size: 14px;

    line-height: 1.55;
}


/* =========================================================
   REGION
========================================================= */

details.region {
    background: white;

    border-radius: 13px;

    margin-bottom: 14px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.07);

    overflow: hidden;

    scroll-margin-top: 65px;
}

details.region > summary {
    list-style: none;

    cursor: pointer;

    padding:
        17px 19px;

    display: flex;

    align-items: center;

    gap: 12px;

    user-select: none;
}

details.region >
summary::-webkit-details-marker {
    display: none;
}

.summary-main {
    min-width: 0;
    flex: 1;
}

.summary-title {
    font-size: 21px;
    font-weight: 700;
}

.day-line {
    margin-top: 5px;

    color: #1f4e79;

    font-size: 14px;

    font-weight: 700;
}

.summary-desc {
    margin-top: 5px;

    color: #687580;

    font-size: 13px;

    line-height: 1.45;
}

.count {
    flex-shrink: 0;

    padding:
        5px 9px;

    border-radius: 15px;

    background: #eaf2f8;

    color: #1f4e79;

    font-size: 11px;

    font-weight: 700;
}

details.region >
summary::after {
    content: "＋";

    color: #1f4e79;

    font-size: 24px;

    font-weight: bold;
}

details.region[open] >
summary::after {
    content: "−";
}

details.region[open] >
summary {
    border-bottom:
        1px solid #e4eaef;
}

.region-body {
    padding: 17px;
}

   ROUTE BOX
========================================================= */

.route-box {
    background:
        linear-gradient(
            135deg,
            #edf5fb,
            #f7fafc
        );

    border-left:
        4px solid #1f4e79;

    border-radius: 8px;

    padding:
        12px 14px;

    margin-bottom: 10px;
}

.route-title {
    color: #1f4e79;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 5px;
}

.route-text {
    font-size: 14px;

    font-weight: 600;

    line-height: 1.55;
}


/* =========================================================
   ITINERARY LINK
========================================================= */

.itinerary-jump {
    margin-bottom: 14px;
}

.itinerary-button {
    display: inline-block;

    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            #1f4e79,
            #3579a9

    padding:

    border-radius: 8px;

    font-size: 12px;

    font-weight: 700;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,.10);
}


/* =========================================================
   MAP BUTTONS
========================================================= */

.places-box {
    margin-bottom: 15px;
}

.places-title {
    color: #687580;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 7px;
}

.places-row {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}

.map-link {
    display: inline-block;

    background: #e9f4ec;

    color: #27623a;

    border:

    text-decoration: none;

    border-radius: 17px;

    padding:
        7px 11px;

    font-size: 12px;

    font-weight: 600;
}


/* =========================================================
   DECISION PANEL
========================================================= */

.decision-panel {
    background: #fff7dc;

    border:

    border-radius: 10px;

    padding:
        13px 14px;

    margin-bottom: 16px;
}

.decision-title {
    color: #765800;

    font-weight: 700;

    margin-bottom: 9px;
}

.decision-step {

    padding:

    margin-top: 6px;

    font-size: 13px;

    line-height: 1.5;
}

.decision-links {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    margin-top: 10px;
}

========================================================= */

.cam-grid {
    display: grid;

    grid-template-columns:

    gap: 16px;
}

.cam-card {
    min-width: 0;

    background: #f6f8fa;

    border-radius: 11px;

    padding: 13px;
}

.cam-top {

}

.cam-text {

    flex: 1;

.cam-card h3 {

    font-size: 16px;

    line-height: 1.3;
}

.cam-card p {

    color: #65727c;

    font-size: 12px;

    line-height: 1.5;
}


/* =========================================================

========================================================= */

.badges {

    flex-direction: column;

    color: #25713c;
}

.badge-road {

    color: #856000;

.priority-must {

.priority-ref {
    background: #e7f0ff;
    color: #2f5b91;
}

.priority-backup {
    background: #ececec;
    color: #666;

========================================================= */

.media-box {

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    border-radius: 9px;

    background: #172029;

    display: flex;

    align-items: center;

    justify-content: center;
}

.media-status {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 15px;

    color: #bbc6ce;

    font-size: 12px;
}

.media-box.loaded
.media-status {
    display: none;
}

iframe.live-video {
    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;
}

img.live-img {
    position: relative;

    z-index: 2;

    display: none;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #111;
}

.media-box.loaded
img.live-img {
    display: block;
}

   BUTTONS
========================================================= */

.actions {

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 9px;

.button {

    color: white;

    text-decoration: none;

    font-size: 12px;

    font-weight: 600;

}

.button.secondary {

/* =========================================================

========================================================= */

.official-links-title {

    font-size: 12px;

    font-weight: 700;

.link-row {

    text-decoration: none;

    color: #28577c;

    border:

    padding:

    font-size: 12px;

    font-weight: 600;

/* =========================================================
   FOOTER
========================================================= */

footer {

    color: #7a8791;

    font-size: 12px;

    padding:

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 720px) {

    .container {
        padding: 9px;

    header h1 {

    }

    .cam-grid {
        grid-template-columns: 1fr;
    }

    details.region > summary {
        padding: 14px;
    }

    .summary-title {
        font-size: 18px;
    }

    .count {
        display: none;
    }

    .region-body {
        padding: 11px;
    }

    .badges {
        flex-direction: row;
    }

}

function priorityInfo(
    priority
) {

    if (
        priority === "must"
    ) {

        return {
            text: "⭐ 必睇",
            cls: "priority-must"
        };

    }


    if (
        priority === "backup"
    ) {

        return {
            text: "🔄 後備",
            cls: "priority-backup"
        };

    }


    return {
        text: "👀 參考",
        cls: "priority-ref"
    };

}


function youtubeEmbed(
    id
) {

    return (
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1" +
        "&mute=1" +
        "&controls=0" +
        "&rel=0" +
        "&playsinline=1"
    );

}


function cacheBust(
    url
) {

    return (
        url +
        (
            url.includes("?")
            ? "&"
            : "?"
        ) +
        "t=" +
        Date.now()
    );

}


function mapsUrl(
    query
) {

    return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
    );

}

function loadSection(
    details
) {

    details

    .querySelectorAll(
        "iframe.live-video"
    )

    .forEach(

        frame => {

            if (
                !frame.hasAttribute(
                    "src"
                )
            ) {

                frame.src =
                    frame.dataset.src;


                frame.addEventListener(

                    "load",

                    () => {

                        frame

                        .closest(
                            ".media-box"
                        )

                        .classList.add(
                            "loaded"
                        );

                    },

                    {
                        once: true
                    }

                );

            }

        }

    );


    details

    .querySelectorAll(
        "img.live-img"
    )

    .forEach(
        loadImage
    );

}


function stopSection(
    details
) {

    details

    .querySelectorAll(
        "iframe.live-video"
    )

    .forEach(

        frame => {

            frame.removeAttribute(
                "src"
            );


            frame

            .closest(
                ".media-box"
            )

            .classList.remove(
                "loaded"
            );

        }

    );

}


function loadImage(
    img
) {

    const box =
        img.closest(
            ".media-box"
        );


    const status =
        box.querySelector(
            ".media-status"
        );


    box.classList.remove(
        "loaded"
    );


    img.onload =
        function() {

            box.classList.add(
                "loaded"
            );


            status.textContent =
                "";

        };


    img.onerror =
        function() {

            box.classList.remove(
                "loaded"
            );


            status.innerHTML =
                "⚠️ 暫時未能讀取圖片<br>請按官方來源";

        };


    img.src =
        cacheBust(
            img.dataset.src
        );

}


function japanTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(

        "zh-HK",

        {
            timeZone:
                "Asia/Tokyo",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                false
        }

    )

    .format(date);

}


function japanDateKey() {

    const parts =

        new Intl.DateTimeFormat(

            "en-CA",

            {
                timeZone:
                    "Asia/Tokyo",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }

        )

        .formatToParts(
            new Date()
        );


    const values = {};


    parts.forEach(

        part => {

            values[
                part.type
            ] =
                part.value;

        }

    );


    return (
        values.year +
        "-" +
        values.month +
        "-" +
        values.day
    );

}

    function weatherDay(day){
        const chosen = localStorage.getItem(KEY);
        if (!chosen) return {title:day.toUpperCase()+'｜等待選擇新穗高日子',route:'去「詳細行程」揀 D6／D7／D8 邊日去新穗高。',hard:'未鎖定',hotel:day==='d8'?'Iroha Grand Hotel 松本':'高山住宿',hotelMap:day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Takayama Ouan',stops:[]};
        const sh = chosen;
        let type;
        if (day===sh) type='sh';
        else if ((sh==='d6' && day==='d7') || ((sh==='d7'||sh==='d8') && day==='d7')) type='shirakawa';
        else type='takayama';
        if (sh==='d7' && day==='d8') type='shirakawa';
        if (sh==='d8' && day==='d7') type='shirakawa';
        if (sh==='d6' && day==='d8') type='takayama';
        if (day==='d6' && sh!=='d6') type='takayama';

        if (type==='sh') {
  return {title:day.toUpperCase()+'｜新穗高纜車',route:'高山 → 新穗高 → '+(day==='d8'?'松本':'高山'),hard:day==='d8'?'完成後預足時間返松本':'天氣清晰＋正常運行先出發',hotel:day==='d8'?'Iroha Grand Hotel 松本':'高山住宿',hotelMap:day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Takayama Ouan',stops:[['09:00','新穗高溫泉停車場','新穂高温泉駐車場'],['10:30','新穗高纜車','新穂高温泉駐車場'],['17:15',day==='d8'?'Iroha Grand Hotel 松本':'高山住宿',day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Takayama Ouan']]};
        }
        if (type==='shirakawa') {
  return {title:day.toUpperCase()+'｜白川鄉',route:'高山 → 白川鄉 → '+(day==='d8'?'松本':'高山'),hard:day==='d8'?'14:00 左右離開白川鄉':'道路安全優先',hotel:day==='d8'?'Iroha Grand Hotel 松本':'Residence Hotel Takayama Station',hotelMap:day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Residence Hotel Takayama Station',stops:[['09:15','白川鄉・せせらぎ公園駐車場','せせらぎ公園駐車場 白川郷'],['10:15','白川鄉','せせらぎ公園駐車場 白川郷'],['17:15',day==='d8'?'Iroha Grand Hotel 松本':'Residence Hotel Takayama Station',day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Residence Hotel Takayama Station']]};
        }
        return {title:day.toUpperCase()+'｜高山市區＋飛驒大鐘乳洞',route:'宮川朝市 → 高山陣屋／三町 → 飛驒大鐘乳洞 → '+(day==='d8'?'松本':'高山'),hard:day==='d8'?'14:40 左右離開鐘乳洞返松本':'唔為 Bonus 拖夜路',hotel:day==='d8'?'Iroha Grand Hotel 松本':'高山住宿',hotelMap:day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Takayama Ouan',stops:[['09:30','宮川朝市','宮川朝市 高山'],['10:15','高山陣屋／三町','中橋駐車場 高山'],['13:50','飛驒大鐘乳洞','Hida Great Limestone Cave'],['17:15',day==='d8'?'Iroha Grand Hotel 松本':'高山住宿',day==='d8'?'Iroha Grand Hotel Matsumoto Ekimae':'Takayama Ouan']]};
    }

    function nextStop(stops, hm){
        if (!stops || !stops.length) return null;
        for (const s of stops) if (s[0] >= hm) return s;
        return stops[stops.length-1];
    }

    function render(){
        const panel = document.querySelector('.today-panel');
        if (!panel || document.getElementById('tripv2TodayCard')) return;
        const card = document.createElement('section');
        card.id='tripv2TodayCard'; card.className='tripv2-today-card';
        panel.insertAdjacentElement('afterend', card);
        const n=jpNow();
        const map={'2027-01-09':'d1','2027-01-10':'d2','2027-01-11':'d3','2027-01-12':'d4','2027-01-13':'d5','2027-01-14':'d6','2027-01-15':'d7','2027-01-16':'d8','2027-01-17':'d9'};
        const id=map[n.date];
        if(!id){
  card.innerHTML='<h2>🧭 Today Card</h2><div class="tripv2-today-route">旅行期間 2027/1/9–1/17 會自動顯示今日路線、Hard Cut、下一站導航同今晚酒店。</div>';
  return;
        }
        const d=(id==='d6'||id==='d7'||id==='d8')?weatherDay(id):base[id];
        const ns=nextStop(d.stops,n.hm);
        card.innerHTML='<h2>'+d.title+'</h2>'+
  '<div class="tripv2-today-route">'+d.route+'</div>'+
  '<div class="tripv2-today-grid"><div class="tripv2-today-box tripv2-hardcut">⏰ <strong>Hard Cut</strong><br>'+d.hard+'</div><div class="tripv2-today-box">🏨 <strong>今晚</strong><br><a href="'+mapUrl(d.hotelMap)+'" target="_blank" rel="noopener">'+d.hotel+' 📍</a></div></div>'+
  (ns?'<a class="tripv2-nav-main" href="'+mapUrl(ns[2])+'" target="_blank" rel="noopener">🚗 下一站：'+ns[1]+'　📍</a>':'')+
  '<div class="tripv2-today-actions"><a href="index.html#'+id+'">📹 今日 Live Cam</a><a href="itinerary.html#'+id+'">🗓️ 今日詳細行程</a></div>';
    }

    document.addEventListener('DOMContentLoaded', render);
})();
</script>
