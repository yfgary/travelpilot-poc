name: Build Full Production Clone POC

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/full-production-clone.yml

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: main
          path: production-source
          fetch-depth: 1

      - name: Build full clone with Standard overlay
        run: bash scripts/build-full-clone.sh

      - name: Commit full-clone POC
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Build full production clone with Standard Japan overlay
          branch: main
