name: TravelPilot QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'round*'

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release version QA
        run: python scripts/qa_release.py
      - name: Run static QA
        run: python scripts/qa.py
      - name: Run Standard Multi-Trip contract QA
        run: python scripts/qa_standard_contract.py
      - name: Run checklist migration QA
        run: python scripts/qa_checklist.py
      - name: Run observer regression QA
        run: python scripts/qa_observers.py
      - name: Run legacy update cleanup QA
        run: python scripts/qa_legacy_update.py
      - name: Run loader dependency QA
        run: python scripts/qa_loader.py
      - name: Run dead asset QA
        run: python scripts/qa_dead_assets.py
      - name: Run orphan JS/CSS QA
        run: python scripts/qa_orphan_assets.py
      - name: Run v9 patch surface QA
        run: python scripts/qa_v9_patch_surface.py
      - name: Run timer retry surface QA
        run: python scripts/qa_timer_retry_surface.py
      - name: Run visit render event audit QA
        run: python scripts/qa_visit_render_event.py
      - name: Run visit fallback audit QA
        run: python scripts/qa_visit_fallback_audit.py
      - name: Run Trip Info event audit QA
        run: python scripts/qa_trip_info_event_audit.py
      - name: Run info-icon event audit QA
        run: python scripts/qa_info_icon_event_audit.py
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
