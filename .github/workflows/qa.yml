name: TravelPilot POC Baseline QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: main
          path: production-reference

      - name: Isolate production baseline
        run: |
          rm -rf /tmp/production-reference
          cp -a production-reference /tmp/production-reference
          rm -rf production-reference

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Existing QA outcome parity
        run: |
          set -u
          tests="qa_release.py qa.py qa_checklist.py qa_observers.py qa_legacy_update.py qa_loader.py qa_dead_assets.py qa_orphan_assets.py qa_v9_patch_surface.py qa_timer_retry_surface.py qa_visit_render_event.py qa_visit_fallback_audit.py qa_trip_info_event_audit.py qa_info_icon_event_audit.py"
          for test in $tests; do
            set +e
            python "scripts/$test" >/tmp/candidate-qa.log 2>&1
            candidate_rc=$?
            (cd /tmp/production-reference && python "scripts/$test") >/tmp/reference-qa.log 2>&1
            reference_rc=$?
            set -e
            echo "$test candidate=$candidate_rc reference=$reference_rc"
            if [ "$candidate_rc" -ne "$reference_rc" ]; then
              echo "POC introduced a new QA outcome for $test"
              echo "--- POC ---"; cat /tmp/candidate-qa.log
              echo "--- production baseline ---"; cat /tmp/reference-qa.log
              exit 1
            fi
          done

      - name: JavaScript syntax
        run: |
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
