name: Round 7 Golden Reference Parity

on:
  push:
    branches:
      - round7-parity-rebuild
      - main
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout production reference
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: main
          path: production-reference

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Existing production regression QA
        run: |
          python scripts/qa_release.py
          python scripts/qa.py
          python scripts/qa_checklist.py
          python scripts/qa_observers.py
          python scripts/qa_legacy_update.py
          python scripts/qa_loader.py
          python scripts/qa_dead_assets.py
          python scripts/qa_orphan_assets.py
          python scripts/qa_v9_patch_surface.py
          python scripts/qa_timer_retry_surface.py
          python scripts/qa_visit_render_event.py
          python scripts/qa_visit_fallback_audit.py
          python scripts/qa_trip_info_event_audit.py
          python scripts/qa_info_icon_event_audit.py
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Production public itinerary remains untouched
        run: |
          cmp itinerary.html production-reference/itinerary.html
          cmp assets/attraction-info.js production-reference/assets/attraction-info.js
          cmp assets/images/d1-centrair.jpg production-reference/assets/images/d1-centrair.jpg

      - name: Candidate loader has no destination hardcodes
        run: |
          node --check assets/standard-runtime-loader-v1.js
          if grep -Eiq 'shirakawago|shinhotaka|白川|新穗高|japan2027' assets/standard-runtime-loader-v1.js; then
            echo "Destination hardcode found in Standard loader"
            exit 1
          fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Golden Reference DOM + feature + visual parity
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/round7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/itinerary.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/round7-parity.mjs
