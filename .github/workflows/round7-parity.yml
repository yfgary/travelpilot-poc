name: Round 7 Golden Reference Parity

on:
  push:
    branches:
      - round7-parity-rebuild
      - main
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout production reference
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: main
          path: production-reference

      - name: Isolate production reference outside candidate tree
        run: |
          rm -rf /tmp/production-reference
          cp -a production-reference /tmp/production-reference
          rm -rf production-reference

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Existing production QA has no new regressions
        run: |
          set -u
          tests="qa_release.py qa.py qa_checklist.py qa_observers.py qa_legacy_update.py qa_loader.py qa_dead_assets.py qa_orphan_assets.py qa_v9_patch_surface.py qa_timer_retry_surface.py qa_visit_render_event.py qa_visit_fallback_audit.py qa_trip_info_event_audit.py qa_info_icon_event_audit.py"
          for test in $tests; do
            set +e
            python "scripts/$test" >/tmp/candidate-qa.log 2>&1
            candidate_rc=$?
            (cd /tmp/production-reference && python "scripts/$test") >/tmp/reference-qa.log 2>&1
            reference_rc=$?
            set -e
            echo "$test candidate=$candidate_rc reference=$reference_rc"
            if [ "$candidate_rc" -ne "$reference_rc" ]; then
              echo "Candidate changed existing QA result for $test"
              echo "--- candidate ---"; cat /tmp/candidate-qa.log
              echo "--- production reference ---"; cat /tmp/reference-qa.log
              exit 1
            fi
          done
          node --check sw.js
          node --check assets/standard-runtime-loader-v1.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Public itinerary differs only by generic loader and approved D6-D8 selector retirement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          candidate=Path("itinerary.html").read_text(encoding="utf-8")
          reference=Path("/tmp/production-reference/itinerary.html").read_text(encoding="utf-8")

          candidate=re.sub(r'<script type="application/json" id="travelPilotRuntimePlan">[\s\S]*?</script>\s*','',candidate)
          candidate=candidate.replace('<script src="assets/standard-runtime-loader-v1.js"></script>','<script src="assets/attraction-info.js?v=1"></script>')
          candidate=re.sub(r'<script id="tripv2-itinerary-script">[\s\S]*?</script>\s*','',candidate)
          reference=re.sub(r'<script id="tripv2-itinerary-script">[\s\S]*?</script>\s*','',reference)

          if candidate!=reference:
              print("Unexpected itinerary.html drift outside generic loader + approved D6-D8 selector retirement")
              sys.exit(1)
          print("Public itinerary structural diff PASS")
          PY
          cmp assets/attraction-info.js /tmp/production-reference/assets/attraction-info.js
          cmp assets/images/d1-centrair.jpg /tmp/production-reference/assets/images/d1-centrair.jpg

      - name: D6-D8 selector retirement is canonical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trip=json.loads(Path("trips/shirakawago-shinhotaka-2027/trip.json").read_text())
          itinerary=json.loads(Path("trips/shirakawago-shinhotaka-2027/itinerary.json").read_text())
          weather=json.loads(Path("trips/shirakawago-shinhotaka-2027/weather.json").read_text())

          assert trip["features"].get("shinhotakaPlanner") is False
          selector=[m for m in trip.get("modules",[]) if m.get("id")=="shinhotaka-weather-day-selector"]
          assert selector and selector[0].get("enabled") is False
          assert "flexibleRules" not in itinerary
          for day in itinerary["days"]:
              if day["id"] in {"d6","d7","d8"}:
                  assert "moduleRefs" not in day
                  assert day.get("weatherRegion") != "dynamic"
          for day in ("d6","d7","d8"):
              assert weather["dayRegions"].get(day) != "dynamic"
          print("D6-D8 selector retirement canonical PASS")
          PY

      - name: Candidate loader has no destination hardcodes
        run: |
          node --check assets/standard-runtime-loader-v1.js
          if grep -Eiq 'shirakawago|shinhotaka|白川|新穗高|japan2027' assets/standard-runtime-loader-v1.js; then
            echo "Destination hardcode found in Standard loader"
            exit 1
          fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Golden Reference DOM + feature + visual parity
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/round7-candidate-http.log 2>&1 &
          CANDIDATE_PID=$!
          (cd /tmp/production-reference && python -m http.server 8001 --bind 127.0.0.1 >/tmp/round7-reference-http.log 2>&1) &
          REFERENCE_PID=$!
          trap 'kill $CANDIDATE_PID $REFERENCE_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/itinerary.html >/dev/null && curl -fsS http://127.0.0.1:8001/itinerary.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/round7-parity.mjs
