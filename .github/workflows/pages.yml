name: POC GitHub Pages

# POC only; deployment requires the complete build and test job to pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yfgary/travelpilot-poc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require reviewed release version bump
        run: |
          node --input-type=module <<'JS'
          import metadata from './package.json' with { type: 'json' };
          if (metadata.version === '2.0.0-poc.45') throw new Error('Draft baseline version: bump App Version with matching assertions before a main release');
          JS
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Dedicated same-origin review smoke
        run: npx playwright test tests/publicReview.spec.ts --grep 'same-origin release smoke' --workers=2 --retries=0
      - run: npm run verify:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.repository == 'yfgary/travelpilot-poc' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy POC
        id: deployment
        uses: actions/deploy-pages@v4
