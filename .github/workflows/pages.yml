name: POC GitHub Pages

# POC only; deployment requires the complete build and test job to pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yfgary/travelpilot-poc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.repository == 'yfgary/travelpilot-poc' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy POC
        id: deployment
        uses: actions/deploy-pages@v4
