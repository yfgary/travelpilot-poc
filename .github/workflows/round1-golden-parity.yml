name: Round 1 Golden Reference Parity

on:
  pull_request:
  push:
    branches:
      - round1-clean-production-baseline
      - main

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Production golden reference
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: 5228dd7774274caac7c647d5ca760ce4d31cf946
          path: production-reference

      - name: Isolate Production reference
        run: |
          rm -rf /tmp/production-reference
          cp -a production-reference /tmp/production-reference
          rm -rf production-reference

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: POC static QA
        run: |
          python scripts/qa_release.py
          python scripts/qa.py
          python scripts/qa_checklist.py
          python scripts/qa_observers.py
          python scripts/qa_legacy_update.py
          python scripts/qa_loader.py
          python scripts/qa_dead_assets.py
          python scripts/qa_orphan_assets.py
          python scripts/qa_v9_patch_surface.py
          python scripts/qa_timer_retry_surface.py
          python scripts/qa_visit_render_event.py
          python scripts/qa_visit_fallback_audit.py
          python scripts/qa_trip_info_event_audit.py
          python scripts/qa_info_icon_event_audit.py
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Runtime files equal Production except release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          c=Path('.')
          p=Path('/tmp/production-reference')
          excluded_prefixes=('.git/','.github/','scripts/')
          allowed={
              'version.json',
              'assets/multi-trip-context-v1.js',
              'assets/multi-trip-live-entry-v1.js',
              'assets/attraction-info.js',
              'index.html',
              'manifest.webmanifest',
              'sw.js',
          }
          def runtime_files(root):
              out={}
              for x in root.rglob('*'):
                  if not x.is_file():
                      continue
                  rel=x.relative_to(root).as_posix()
                  if rel=='.git' or any(rel.startswith(q) for q in excluded_prefixes):
                      continue
                  out[rel]=x
              return out

          a=runtime_files(p); b=runtime_files(c)
          if set(a)!=set(b):
              print('Runtime file set differs')
              print('Production only:', sorted(set(a)-set(b)))
              print('POC only:', sorted(set(b)-set(a)))
              sys.exit(1)

          bad=[]
          for rel in sorted(a):
              if rel in allowed:
                  continue
              if a[rel].read_bytes()!=b[rel].read_bytes():
                  bad.append(rel)
          if bad:
              print('Unexpected runtime drift:', bad)
              sys.exit(1)

          checks=[
            ('assets/multi-trip-context-v1.js','v10.14.0','v10.15.0'),
            ('assets/multi-trip-live-entry-v1.js','10.14.0','10.15.0'),
            ('assets/attraction-info.js','10.14.0','10.15.0'),
            ('index.html','10.14.0','10.15.0'),
            ('manifest.webmanifest','10.14.0','10.15.0'),
          ]
          for rel,old,new in checks:
              prod=a[rel].read_text(encoding='utf-8')
              poc=b[rel].read_text(encoding='utf-8').replace(new,old)
              if prod!=poc:
                  print('Unexpected non-version drift:',rel)
                  sys.exit(1)

          prod=a['sw.js'].read_text(encoding='utf-8')
          poc=b['sw.js'].read_text(encoding='utf-8').replace('v10.15.0','v10.14.0').replace('10.15.0','10.14.0').replace('20261007','20261005')
          if prod!=poc:
              print('Unexpected sw.js drift outside version/cache identity')
              sys.exit(1)

          print('Runtime/source parity PASS')
          PY

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser Golden Reference parity
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/poc-http.log 2>&1 &
          POC_PID=$!
          (cd /tmp/production-reference && python -m http.server 8001 --bind 127.0.0.1 >/tmp/prod-http.log 2>&1) &
          PROD_PID=$!
          trap 'kill $POC_PID $PROD_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/itinerary.html >/dev/null && curl -fsS http://127.0.0.1:8001/itinerary.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/round1-golden-parity.mjs
