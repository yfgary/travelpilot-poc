name: Round 1 Golden Reference Parity

on:
  pull_request:
  push:
    branches:
      - round1-fresh-production-baseline
      - main

permissions:
  contents: read

jobs:
  golden-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC candidate
        uses: actions/checkout@v4

      - name: Checkout pinned Production Golden Reference
        uses: actions/checkout@v4
        with:
          repository: yfgary/travelpilot
          ref: 5228dd7774274caac7c647d5ca760ce4d31cf946
          path: production-reference

      - name: Isolate Production reference
        run: |
          rm -rf /tmp/production-reference
          cp -a production-reference /tmp/production-reference
          rm -rf production-reference

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Round 1 structural and release QA
        run: |
          python scripts/qa_release.py
          python scripts/qa.py
          python scripts/qa_checklist.py
          python scripts/qa_observers.py
          python scripts/qa_legacy_update.py
          python scripts/qa_loader.py
          python scripts/qa_dead_assets.py
          python scripts/qa_orphan_assets.py
          python scripts/qa_v9_patch_surface.py
          python scripts/qa_timer_retry_surface.py
          python scripts/qa_visit_render_event.py
          python scripts/qa_visit_fallback_audit.py
          python scripts/qa_trip_info_event_audit.py
          python scripts/qa_info_icon_event_audit.py
          python scripts/qa_round1_fixed_d6d8.py
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Presentation assets remain byte-identical to Production
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          root=Path('.')
          prod=Path('/tmp/production-reference')
          candidates=list((root/'assets').glob('*.css'))+list((root/'assets'/'images').rglob('*'))
          changed=[]
          for p in candidates:
              if not p.is_file():
                  continue
              q=prod/p
              if not q.is_file() or p.read_bytes()!=q.read_bytes():
                  changed.append(str(p))
          if changed:
              print("Unexpected presentation asset drift:")
              print("\n".join(changed))
              sys.exit(1)
          print(f"Presentation asset byte parity PASS ({len([p for p in candidates if p.is_file()])} files)")
          PY

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Golden Reference browser parity
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/round1-candidate-http.log 2>&1 &
          CANDIDATE_PID=$!
          (cd /tmp/production-reference && python -m http.server 8001 --bind 127.0.0.1 >/tmp/round1-production-http.log 2>&1) &
          PRODUCTION_PID=$!
          trap 'kill $CANDIDATE_PID $PRODUCTION_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/itinerary.html >/dev/null && curl -fsS http://127.0.0.1:8001/itinerary.html >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/round1-golden-parity.mjs
